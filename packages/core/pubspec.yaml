name: bitrack_core
description: "Seluruh logic dan UI yang dipakai bersama oleh app di monorepo ini (fixtrack, bitrack, bitrack_internal). Isinya persis lib/ dari project single-app sebelumnya, minus main.dart."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.8.1

# Anggota pub workspace (lihat pubspec.yaml di root) — versinya di-resolve
# bersama semua app, satu pubspec.lock di root.
resolution: workspace

# Daftar dependency di bawah SENGAJA dibuat identik dengan pubspec.yaml
# single-app sebelumnya. Semua kode yang memakainya sekarang ada di package
# ini, jadi tidak ada yang perlu dipindah/dibuang — app cuma menambahkan
# `bitrack_core` plus paket yang dipakai langsung oleh main.dart.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluentui_icons: ^1.0.0
  flutter_riverpod: ^3.0.3
  dio: ^5.7.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.1.7
  flutter_map: ^6.1.0
  flutter_map_marker_cluster: ^1.3.5
  latlong2: ^0.9.1
  lottie: ^3.1.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.6.1
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  syncfusion_flutter_charts: 31.1.19
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  audioplayers: ^6.7.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # File hasil gen-l10n (lib/l10n/app_localizations*.dart) ikut di-commit,
  # tapi flag ini tetap dibutuhkan supaya `flutter gen-l10n` di package ini
  # membaca l10n.yaml dan me-regenerate saat file .arb diubah.
  generate: true
