# Root workspace monorepo. Bukan sebuah app — file ini cuma mendaftarkan
# anggota workspace supaya `flutter pub get` me-resolve SEMUA app + package
# sekali jalan dan menghasilkan satu pubspec.lock bersama di root ini.
#
# Struktur:
#   apps/*      -> shell tiap app (main.dart, assets, android/, ios/, .env)
#   packages/*  -> kode yang dipakai bersama (lihat packages/core)
name: bitrack_apps
publish_to: none

environment:
  sdk: ^3.8.1

workspace:
  - apps/fixtrack
  - apps/bitrack
  - apps/bitrack_internal
  - packages/core

dev_dependencies:
  melos: ^6.3.3
