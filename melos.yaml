name: bitrack_apps

packages:
  - apps/*
  - packages/*

# Warna primer tiap app dioper lewat --dart-define=APP_PRIMARY_COLOR, BUKAN
# ditulis di kode: AppStyles.primaryColor dipakai di ratusan `const`
# constructor sehingga harus tetap compile-time constant. Lihat
# packages/core/lib/base/res/styles/app_styles.dart.
#
#   fixtrack         0xFF386AD8 (biru)         <- juga nilai default AppStyles
#   bitrack          0xFFD84040 (merah)
#   bitrack_internal 0xFF9E2021 (merah gelap)
#
# Ketiganya ditulis eksplisit di bawah supaya mengganti warna satu app tidak
# perlu menyentuh kode sama sekali, cukup edit file ini + .vscode/launch.json.
scripts:
  analyze:
    run: melos exec -- "flutter analyze"
    description: flutter analyze di semua app & package.

  test:
    run: melos exec --dir-exists=test -- "flutter test"
    description: flutter test di semua package yang punya folder test.

  get:
    run: flutter pub get
    description: Resolve seluruh pub workspace (satu pubspec.lock di root).

  # ---------------------------------------------------------------- run (dev)
  fixtrack:
    run: cd apps/fixtrack && flutter run --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Jalankan FixTrack (dev, pakai .env).

  bitrack:
    run: cd apps/bitrack && flutter run --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Jalankan Bitrack (dev, pakai .env).

  internal:
    run: cd apps/bitrack_internal && flutter run --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Jalankan Bitrack Internal (dev, pakai .env).

  # --------------------------------------------------------------- run (prod)
  fixtrack:prod:
    run: cd apps/fixtrack && flutter run --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Jalankan FixTrack (prod, pakai .env.prod).

  bitrack:prod:
    run: cd apps/bitrack && flutter run --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Jalankan Bitrack (prod, pakai .env.prod).

  internal:prod:
    run: cd apps/bitrack_internal && flutter run --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Jalankan Bitrack Internal (prod, pakai .env.prod).

  # ------------------------------------------------------------- run (release)
  fixtrack:release:
    run: cd apps/fixtrack && flutter run --release --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Jalankan FixTrack (dev .env, build release).

  bitrack:release:
    run: cd apps/bitrack && flutter run --release --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Jalankan Bitrack (dev .env, build release).

  internal:release:
    run: cd apps/bitrack_internal && flutter run --release --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Jalankan Bitrack Internal (dev .env, build release).

  # ------------------------------------------------------------------ APK
  fixtrack:apk:
    run: cd apps/fixtrack && flutter build apk --release --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Build APK FixTrack (dev, pakai .env).

  fixtrack:apk:prod:
    run: cd apps/fixtrack && flutter build apk --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Build APK FixTrack (prod, pakai .env.prod).

  bitrack:apk:
    run: cd apps/bitrack && flutter build apk --release --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Build APK Bitrack (dev, pakai .env).

  bitrack:apk:prod:
    run: cd apps/bitrack && flutter build apk --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Build APK Bitrack (prod, pakai .env.prod).

  internal:apk:
    run: cd apps/bitrack_internal && flutter build apk --release --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Build APK Bitrack Internal (dev, pakai .env).

  internal:apk:prod:
    run: cd apps/bitrack_internal && flutter build apk --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Build APK Bitrack Internal (prod, pakai .env.prod).

  # --------------------------------------------------- App Bundle (Play Store)
  fixtrack:aab:
    run: cd apps/fixtrack && flutter build appbundle --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Build AAB FixTrack untuk Play Store (prod).

  bitrack:aab:
    run: cd apps/bitrack && flutter build appbundle --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Build AAB Bitrack untuk Play Store (prod).

  internal:aab:
    run: cd apps/bitrack_internal && flutter build appbundle --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Build AAB Bitrack Internal untuk Play Store (prod).

  # ------------------------------------------------------------------- iOS
  fixtrack:ios:
    run: cd apps/fixtrack && rm -rf build/native_assets && flutter build ios --release --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Build iOS FixTrack (dev, pakai .env).

  fixtrack:ios:prod:
    run: cd apps/fixtrack && rm -rf build/native_assets && flutter build ios --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF386AD8
    description: Build iOS FixTrack (prod, pakai .env.prod).

  bitrack:ios:
    run: cd apps/bitrack && rm -rf build/native_assets && flutter build ios --release --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Build iOS Bitrack (dev, pakai .env).

  bitrack:ios:prod:
    run: cd apps/bitrack && rm -rf build/native_assets && flutter build ios --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFFD84040
    description: Build iOS Bitrack (prod, pakai .env.prod).

  internal:ios:
    run: cd apps/bitrack_internal && rm -rf build/native_assets && flutter build ios --release --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Build iOS Bitrack Internal (dev, pakai .env).

  internal:ios:prod:
    run: cd apps/bitrack_internal && rm -rf build/native_assets && flutter build ios --release --dart-define=ENV_FILE=.env.prod --dart-define=APP_PRIMARY_COLOR=0xFF9E2021
    description: Build iOS Bitrack Internal (prod, pakai .env.prod).

  # -------------------------------------------------- splash & launcher icon
  # Dijalankan ulang setiap kali assets/logos/logo.png atau warna brand di
  # pubspec app berubah. Keduanya menulis file native (android/app/src/main/res,
  # ios/Runner/Assets.xcassets) yang ikut di-commit.
  branding:
    run: melos exec --scope="fixtrack,bitrack,bitrack_internal" -- "dart run flutter_native_splash:create && dart run flutter_launcher_icons"
    description: Regenerate splash screen + launcher icon untuk ketiga app.

  # ===========================================================================
  # SHOREBIRD (code push / patch tanpa lewat store)
  # ===========================================================================
  #
  # Urutan kerja normal: [1] release -> [1b] verify -> [2] preview ->
  # [3] patch staging -> [4] preview staging -> [5] promote.
  #
  # Yang WAJIB diingat:
  # - AAB/IPA yang di-upload ke store HARUS hasil `*:sb:release:*`, bukan
  #   `*:aab` / `*:ios:prod` di atas — build biasa tidak membawa engine
  #   Shorebird, jadi patch tidak akan pernah sampai ke user.
  # - Patch & preview memakai `version:` pubspec untuk menemukan release-nya:
  #   jalankan dari commit release itu, dan JANGAN naikkan versi untuk patch.
  # - PERINGATAN (Windows): `shorebird.bat` SELALU keluar dengan kode 0, walau
  #   Shorebird-nya gagal. `SUCCESS` dari melos di Windows TIDAK membuktikan
  #   apa pun — percayai hanya baris `Published Release ...` / `Published
  #   Patch ...` di output.
  # - Define dibaca dari apps/<app>/dart_defines.prod.json, BUKAN
  #   `--dart-define=K=V`: `shorebird.bat` memotong `=` sebagai pemisah
  #   argumen.
  # - release, verify, preview & promote lewat tool/shorebird.dart, bukan
  #   `shorebird` langsung — alasannya ada di komentar file itu.

  # ---- FixTrack ----
  fixtrack:sb:release:android:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release android
    description: "[1] FixTrack Android: release ke Shorebird + salin AAB ke rilis/fixtrack-<versi>.aab (file itu yang di-upload ke Play)."

  fixtrack:sb:release:ios:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release ios
    description: "[1] FixTrack iOS: release ke Shorebird + salin IPA ke rilis/fixtrack-<versi>.ipa (butuh Mac)."

  fixtrack:sb:verify:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart verify
    description: "[1b] FixTrack: pastikan AAB di rilis/ benar-benar binary release di Shorebird, bukan hasil build patch."

  fixtrack:sb:preview:android:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android
    description: "[2] FixTrack Android: pasang release ke HP (track stable, seperti user)."

  fixtrack:sb:preview:ios:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios
    description: "[2] FixTrack iOS: pasang release ke HP (track stable, seperti user)."

  fixtrack:sb:patch:android:staging:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch android staging
    description: "[3] FixTrack Android: kirim patch ke track staging (hanya HP preview staging)."

  fixtrack:sb:patch:ios:staging:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch ios staging
    description: "[3] FixTrack iOS: kirim patch ke track staging (butuh Mac)."

  fixtrack:sb:preview:android:staging:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android staging
    description: "[4] FixTrack Android: pasang release + patch staging untuk dites."

  fixtrack:sb:preview:ios:staging:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios staging
    description: "[4] FixTrack iOS: pasang release + patch staging untuk dites."

  fixtrack:sb:promote:
    run: cd apps/fixtrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart promote
    description: "[5] FixTrack: pindahkan patch (nomornya jadi argumen) ke track stable = semua user."

  # ---- Bitrack ----
  bitrack:sb:release:android:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release android
    description: "[1] Bitrack Android: release ke Shorebird + salin AAB ke rilis/bitrack-<versi>.aab (file itu yang di-upload ke Play)."

  bitrack:sb:release:ios:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release ios
    description: "[1] Bitrack iOS: release ke Shorebird + salin IPA ke rilis/bitrack-<versi>.ipa (butuh Mac)."

  bitrack:sb:verify:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart verify
    description: "[1b] Bitrack: pastikan AAB di rilis/ benar-benar binary release di Shorebird, bukan hasil build patch."

  bitrack:sb:preview:android:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android
    description: "[2] Bitrack Android: pasang release ke HP (track stable, seperti user)."

  bitrack:sb:preview:ios:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios
    description: "[2] Bitrack iOS: pasang release ke HP (track stable, seperti user)."

  bitrack:sb:patch:android:staging:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch android staging
    description: "[3] Bitrack Android: kirim patch ke track staging (hanya HP preview staging)."

  bitrack:sb:patch:ios:staging:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch ios staging
    description: "[3] Bitrack iOS: kirim patch ke track staging (butuh Mac)."

  bitrack:sb:preview:android:staging:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android staging
    description: "[4] Bitrack Android: pasang release + patch staging untuk dites."

  bitrack:sb:preview:ios:staging:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios staging
    description: "[4] Bitrack iOS: pasang release + patch staging untuk dites."

  bitrack:sb:promote:
    run: cd apps/bitrack && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart promote
    description: "[5] Bitrack: pindahkan patch (nomornya jadi argumen) ke track stable = semua user."

  # ---- Bitrack Internal ----
  internal:sb:release:android:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release android
    description: "[1] Bitrack Internal Android: release ke Shorebird + salin AAB ke rilis/bitrack_internal-<versi>.aab (file itu yang di-upload ke Play)."

  internal:sb:release:ios:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart release ios
    description: "[1] Bitrack Internal iOS: release ke Shorebird + salin IPA ke rilis/bitrack_internal-<versi>.ipa (butuh Mac)."

  internal:sb:verify:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart verify
    description: "[1b] Bitrack Internal: pastikan AAB di rilis/ benar-benar binary release di Shorebird, bukan hasil build patch."

  internal:sb:preview:android:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android
    description: "[2] Bitrack Internal Android: pasang release ke HP (track stable, seperti user)."

  internal:sb:preview:ios:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios
    description: "[2] Bitrack Internal iOS: pasang release ke HP (track stable, seperti user)."

  internal:sb:patch:android:staging:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch android staging
    description: "[3] Bitrack Internal Android: kirim patch ke track staging (hanya HP preview staging)."

  internal:sb:patch:ios:staging:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart patch ios staging
    description: "[3] Bitrack Internal iOS: kirim patch ke track staging (butuh Mac)."

  internal:sb:preview:android:staging:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview android staging
    description: "[4] Bitrack Internal Android: pasang release + patch staging untuk dites."

  internal:sb:preview:ios:staging:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart preview ios staging
    description: "[4] Bitrack Internal iOS: pasang release + patch staging untuk dites."

  internal:sb:promote:
    run: cd apps/bitrack_internal && dart --packages=../../tool/package_config.json ../../tool/shorebird.dart promote
    description: "[5] Bitrack Internal: pindahkan patch (nomornya jadi argumen) ke track stable = semua user."

